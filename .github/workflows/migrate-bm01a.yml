name: Migrate BM01A files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          BASE="https://raw.githubusercontent.com/anhvt777/Kehoachtuan/main"
          mkdir -p bm01a-cccd bm01a-cccd-ocr bm01a-cccd-photo
          curl -fsSL "$BASE/bm01a-cccd/v12-jsqr.html" -o bm01a-cccd/v12-jsqr.html
          curl -fsSL "$BASE/bm01a-cccd/v19-calibration.js" -o bm01a-cccd/v19-calibration.js
          curl -fsSL "$BASE/bm01a-cccd/scan-fix-v21.js" -o bm01a-cccd/scan-fix-v21.js
          curl -fsSL "$BASE/bm01a-cccd/mobile-ui-fix-v21.js" -o bm01a-cccd/mobile-ui-fix-v21.js
          curl -fsSL "$BASE/bm01a-cccd/report-xlsx-short-v25.js" -o bm01a-cccd/report-xlsx-short-v25.js
          curl -fsSL "$BASE/bm01a-cccd/report-luong-export-v22.js" -o bm01a-cccd/report-luong-export-v22.js
          curl -fsSL "$BASE/bm01a-cccd-ocr/index.html" -o bm01a-cccd-ocr/index.html
          curl -fsSL "$BASE/bm01a-cccd-ocr/ocr-cccd-v23.js" -o bm01a-cccd-ocr/ocr-cccd-v23.js
          curl -fsSL "$BASE/bm01a-cccd-ocr/ocr-upload-fix-v25.js" -o bm01a-cccd-ocr/ocr-upload-fix-v25.js
          curl -fsSL "$BASE/bm01a-cccd-ocr/ocr-upload-fix-v27.js" -o bm01a-cccd-ocr/ocr-upload-fix-v27.js
          curl -fsSL "$BASE/bm01a-cccd-photo/index.html" -o bm01a-cccd-photo/index.html
          curl -fsSL "$BASE/bm01a-cccd-photo/photo-scan-v22.js" -o bm01a-cccd-photo/photo-scan-v22.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --cached --quiet || git commit -m "Migrate BM01A files"
          git push
